// Redistributable ASM fixtures; external legacy artifacts are optional evidence.
sourceSets {
    compatibilityTest {
        java.srcDir 'src/compatibilityTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('compatibilityTest', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('classes'), tasks.named('compatibilityTestClasses')
    classpath = sourceSets.compatibilityTest.runtimeClasspath
    mainClass = 'com.fuckingdeveloper.lms.check.GameplayFamilyCheck'
    workingDir = layout.projectDirectory.dir('run')
}

tasks.register('compatibilityAudit', JavaExec) {
    group = 'verification'
    description = 'Inventory unresolved members in transformed legacy binaries without starting Minecraft'
    dependsOn tasks.named('classes'), tasks.named('compatibilityTestClasses')
    classpath = sourceSets.compatibilityTest.runtimeClasspath
    mainClass = 'com.fuckingdeveloper.lms.check.TransformedLinkageAudit'
    workingDir = layout.projectDirectory.dir('run')
}

tasks.register('generateSourceHierarchy', JavaExec) {
    group = 'verification'
    description = 'Regenerate pinned Forge 1.19.2 loader declarations from an immutable source development JAR'
    dependsOn tasks.named('compatibilityTestClasses')
    classpath = sourceSets.compatibilityTest.runtimeClasspath
    mainClass = 'com.fuckingdeveloper.lms.check.GenerateSourceHierarchy'
    doFirst {
        def sourceJar = providers.gradleProperty('legacySourceJar').orNull
        if (sourceJar == null || !file(sourceJar).isFile()) throw new GradleException('Supply -PlegacySourceJar=/absolute/path/to/Forge-1.19.2-43.4.0-named-patched.jar')
        args sourceJar, layout.projectDirectory.file('src/main/resources/lms/profile/forge1192/loader-hierarchy.tsv').asFile.absolutePath
    }
}

// The probe is a target game library, not a fabricated native/legacy mod.
def nativeSmokeJar = tasks.register('nativeSmokeJar', Jar) {
    dependsOn tasks.named('compatibilityTestClasses')
    archiveClassifier = 'native-smoke'
    from(sourceSets.compatibilityTest.output) {
        include '**/LifecycleWorkFamilyCheck*.class', '**/LifecycleWorkFixture*.class'
        include '**/AnalogOutputFamilyCheck*.class'
        include '**/VanillaItemTransferFamilyCheck*.class'
        include '**/NativeLifecycleSmokeLauncher*.class', '**/LiveTargetContractProbe*.class', '**/SlotRenderFamilyCheck*.class', '**/SubscriberIndexCheck*.class', '**/BlockDataFamilyCheck*.class', '**/WorldRenderFamilyCheck*.class', '**/ChunkUnloadOrderCheck*.class', '**/PlayerMessageFamilyCheck*.class', '**/ContainerRenderLifecycleCheck*.class', '**/SearchTooltipContextCheck*.class', '**/ScreenStateFamilyCheck*.class', '**/ButtonFamilyCheck*.class', '**/WidgetHierarchyFamilyCheck*.class', '**/CommonTagFamilyCheck*.class', '**/CommonTagProjectionCheck*.class', '**/ScreenLayerFamilyCheck*.class', '**/ReloadLookupFamilyCheck*.class', '**/SmithingFamilyCheck*.class', '**/VanillaItemRenameCheck*.class', '**/PairedVanillaTagCheck*.class', '**/RecipeRewardsCheck*.class', '**/FuelQueryFamilyCheck*.class', '**/StackComparisonFamilyCheck*.class', '**/CookingRecipeInformationCheck*.class', '**/InteractionResultInformationCheck*.class', '**/GuiPlaneFamilyCheck*.class', '**/WorldgenFamilyCheck*.class', '**/LegacyTagResourceCheck*.class', '**/LootModifierFamilyCheck*.class', '**/InitialDataTransactionCheck*.class', '**/ArmorEquipmentFamilyCheck*.class', '**/DamageDataFamilyCheck*.class', '**/CombatRuleFamilyCheck*.class', '**/BlockExtensionDefaultsCheck*.class', '**/AttributeOperationFamilyCheck*.class', '**/CreativeConstructionFamilyCheck*.class', '**/StaticItemResourcesCheck*.class', '**/CustomItemRenderingCheck*.class', '**/NestedItemRenderingCheck*.class', '**/DeferredCustomItemCheck*.class', '**/GroundCustomItemCheck*.class', '**/ToolActionFamilyCheck*.class', '**/PoseMatrixDrawCheck*.class', '**/SoundHolderFieldCheck*.class', '**/SoundEventValueCheck*.class', '**/EmptyStackDecodeCheck*.class', '**/DamageDescriptorFamilyCheck*.class', '**/BootstrapFamilyCheck*.class', '**/SourceContainerFamilyCheck*.class', '**/ContainerPersistenceFamilyCheck*.class', '**/ContainerUsersFamilyCheck*.class', '**/GameRulesFamilyCheck*.class', '**/NativeConfigFamilyCheck*.class', '**/SelectionListFamilyCheck*.class', '**/WidgetPointerFamilyCheck*.class', '**/GuiPointerFamilyCheck*.class', '**/EditBoxFamilyCheck*.class', '**/AtlasMaterialFamilyCheck*.class', '**/GuiConsumerFamilyCheck*.class', '**/GuiItemOperationCheck*.class', '**/PendingFluidAndMappingCheck*.class', '**/WidgetExtractionFamilyCheck*.class', '**/SourceGuiAssetsCheck*.class', '**/ContainerGraphicsCheck*.class', '**/BonemealFamilyCheck*.class', '**/ComponentJsonCheck*.class', '**/ItemWireFamilyCheck*.class', '**/EarlyFluidFamilyCheck*.class', '**/NativeDefaultComponentFixture*.class'
    }
    manifest { attributes('FMLModType': 'GAMELIBRARY', 'Automatic-Module-Name': 'lms.compatibility.smoke') }
}
tasks.register('nativeCompatibilitySmoke', JavaExec) {
    group = 'verification'
    description = 'Check physical-client FML-applied hooks without starting Minecraft, a world or window'
    dependsOn tasks.named('prepareServerRun'), nativeSmokeJar, installLaunchJar, prepareLaunchPlan
    javaLauncher = tasks.named('runServer', JavaExec).flatMap { it.javaLauncher }
    mainClass = 'com.fuckingdeveloper.lms.check.NativeLifecycleSmokeLauncher'
    workingDir = layout.projectDirectory.dir('run')
    doFirst {
        def nativeRun = tasks.named('runServer', JavaExec).get()
        setJvmArgs(nativeRun.jvmArgs)
        nativeRun.jvmArgumentProviders.each { jvmArgs(it.asArguments()) }
        setClasspath(nativeRun.classpathProvider + files(nativeSmokeJar.get().archiveFile.get().asFile))
    }
}

tasks.register('compatibilityBatchReport', JavaExec) {
    group = 'verification'
    description = 'Group admission blockers across legacy artifacts without executing mods'
    dependsOn tasks.named('classes'), tasks.named('compatibilityTestClasses')
    classpath = sourceSets.compatibilityTest.runtimeClasspath
    mainClass = 'com.fuckingdeveloper.lms.check.CompatibilityBatchReport'
    workingDir = layout.projectDirectory.dir('run')
}
