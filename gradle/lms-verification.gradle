// Metadata-only regeneration; never execute while a client is using build outputs.
tasks.register('generateSourcePublicBlockAccess', JavaExec) {
    group = 'verification'
    description = 'Regenerate exact retained source-public block callback access from pinned source and target metadata'
    dependsOn tasks.named('compatibilityTestClasses')
    classpath = sourceSets.compatibilityTest.runtimeClasspath
    mainClass = 'com.fuckingdeveloper.lms.check.GenerateSourcePublicBlockAccess'
    doFirst {
        def sourceJar = providers.gradleProperty('legacySourceJar').orNull
        if (sourceJar == null || !file(sourceJar).isFile()) throw new GradleException('Supply -PlegacySourceJar=/absolute/path/to/Forge-1.19.2-43.4.0-named-patched.jar')
        args sourceJar,
            layout.buildDirectory.file('moddev/artifacts/minecraft-patched-26.3.0.58-beta.jar').get().asFile.absolutePath,
            layout.projectDirectory.file('src/main/resources/META-INF/accesstransformer.cfg').asFile.absolutePath
    }
}

