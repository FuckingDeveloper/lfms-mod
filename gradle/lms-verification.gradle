        include '**/TagNotificationFamilyCheck*.class', '**/RecipeNotificationFamilyCheck*.class', '**/SourceLoaderEnvironmentCheck*.class', '**/SourceIngredientFamilyCheck*.class', '**/ManagedServiceResourceCheck*.class', '**/SourceOwnedAtlasCheck*.class', '**/SourceEntityRidingCheck*.class', '**/RawNetworkFamilyCheck*.class', '**/SourceBannerPatternCheck*.class', '**/CapturedConstructionCheck*.class', '**/SourceClientEntityFactoryCheck*.class', '**/SourceStairConstructionCheck*.class', '**/SourceExtensionEventCheck*.class', '**/SourceEntityRenderFamilyCheck*.class', '**/GuiStaticAccessorFamilyCheck*.class', '**/GuiModelViewFamilyCheck*.class', '**/RegistryQueryFamilyCheck*.class', '**/RendererContextFamilyCheck*.class', '**/TexturedRenderTypeFamilyCheck*.class', '**/SourceConfigRegistrationCheck*.class', '**/SourceMenuFactoryCheck*.class', '**/SourceProjectileFamilyCheck*.class'
        include '**/LifecycleWorkFamilyCheck*.class', '**/LifecycleWorkFixture*.class'
        include '**/AnalogOutputFamilyCheck*.class'
        include '**/VanillaItemTransferFamilyCheck*.class'
        include '**/NativeLifecycleSmokeLauncher*.class', '**/LiveTargetContractProbe*.class', '**/SlotRenderFamilyCheck*.class', '**/SubscriberIndexCheck*.class', '**/BlockDataFamilyCheck*.class', '**/WorldRenderFamilyCheck*.class', '**/ChunkUnloadOrderCheck*.class', '**/PlayerMessageFamilyCheck*.class', '**/ContainerRenderLifecycleCheck*.class', '**/SearchTooltipContextCheck*.class', '**/ScreenStateFamilyCheck*.class', '**/ButtonFamilyCheck*.class', '**/WidgetHierarchyFamilyCheck*.class', '**/CommonTagFamilyCheck*.class', '**/CommonTagProjectionCheck*.class', '**/ScreenLayerFamilyCheck*.class', '**/ReloadLookupFamilyCheck*.class', '**/SmithingFamilyCheck*.class', '**/VanillaItemRenameCheck*.class', '**/PairedVanillaTagCheck*.class', '**/RecipeRewardsCheck*.class', '**/FuelQueryFamilyCheck*.class', '**/StackComparisonFamilyCheck*.class', '**/CookingRecipeInformationCheck*.class', '**/InteractionResultInformationCheck*.class', '**/GuiPlaneFamilyCheck*.class', '**/WorldgenFamilyCheck*.class', '**/LegacyTagResourceCheck*.class', '**/LootModifierFamilyCheck*.class', '**/InitialDataTransactionCheck*.class', '**/ArmorEquipmentFamilyCheck*.class', '**/DamageDataFamilyCheck*.class', '**/CombatRuleFamilyCheck*.class', '**/BlockExtensionDefaultsCheck*.class', '**/AttributeOperationFamilyCheck*.class', '**/CreativeConstructionFamilyCheck*.class', '**/SoundManagerPlaybackFamilyCheck*.class', '**/EntityDataBuilderFamilyCheck*.class', '**/GameEventDeliveryFamilyCheck*.class', '**/EntityAllocationFamilyCheck*.class', '**/ExplosionExecutionFamilyCheck*.class', '**/ChunkLightPacketFamilyCheck*.class', '**/HeightQueryFamilyCheck*.class', '**/DamageDeliveryFamilyCheck*.class', '**/DamageFactoryFamilyCheck*.class', '**/ItemCooldownFamilyCheck*.class', '**/StaticItemResourcesCheck*.class', '**/CustomItemRenderingCheck*.class', '**/NestedItemRenderingCheck*.class', '**/DeferredCustomItemCheck*.class', '**/GroundCustomItemCheck*.class', '**/ToolActionFamilyCheck*.class', '**/PoseMatrixDrawCheck*.class', '**/SoundHolderFieldCheck*.class', '**/SoundEventValueCheck*.class', '**/EmptyStackDecodeCheck*.class', '**/DamageDescriptorFamilyCheck*.class', '**/BootstrapFamilyCheck*.class', '**/SourceContainerFamilyCheck*.class', '**/ContainerPersistenceFamilyCheck*.class', '**/ContainerUsersFamilyCheck*.class', '**/GameRulesFamilyCheck*.class', '**/NativeConfigFamilyCheck*.class', '**/SelectionListFamilyCheck*.class', '**/WidgetPointerFamilyCheck*.class', '**/GuiPointerFamilyCheck*.class', '**/EditBoxFamilyCheck*.class', '**/AtlasMaterialFamilyCheck*.class', '**/GuiConsumerFamilyCheck*.class', '**/GuiItemOperationCheck*.class', '**/PendingFluidAndMappingCheck*.class', '**/WidgetExtractionFamilyCheck*.class', '**/SourceGuiAssetsCheck*.class', '**/ContainerGraphicsCheck*.class', '**/BonemealFamilyCheck*.class', '**/ComponentJsonCheck*.class', '**/ItemWireFamilyCheck*.class', '**/EarlyFluidFamilyCheck*.class', '**/NativeDefaultComponentFixture*.class'
    }
