modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/FuckingDeveloper/lfms-mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="FuckingDeveloper"
displayURL="https://www.fuckingdeveloper.com"
iconFile="lms_logo_pixel.png"
iconBlur=false
bannerFile="lms_banner.png"
description='''
Old mods. New Minecraft.

LMS (Legacy Mod Support) adapts original legacy Forge/FML mod binaries
for modern Minecraft and NeoForge through version profiles and runtime bridges.

Experimental: compatibility is incomplete and varies by mod and API family.
Current target: Minecraft 26.3 / NeoForge. First source profile: Forge 1.19.2.

Created by FuckingDeveloper | 2026
Website: www.fuckingdeveloper.com
'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="lms.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"
