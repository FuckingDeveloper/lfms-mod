plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            def sourceGuiAssets = providers.gradleProperty('lmsSourceClientAssets').orElse(
                new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/minecraft_repo/versions/1.19.2/client-extra.jar').absolutePath)
            if (file(sourceGuiAssets.get()).isFile()) systemProperty 'lms.forge1192.clientAssets', file(sourceGuiAssets.get()).absolutePath
            // Preserve DevLaunch's main class and generated arguments. JavaExec
            // --args replaces them, so append native Quick Play through the run DSL.
            def testWorld = providers.gradleProperty('lmsTestWorld')
            if (testWorld.isPresent()) {
                def worldId = testWorld.get()
                if (worldId.isBlank()) throw new GradleException('lmsTestWorld must name an existing directory under run/saves')
                programArgument '--quickPlaySingleplayer'
                programArgument worldId
            }
        }
        server { server(); programArgument '--nogui' }
    }
    mods {
        lms { sourceSet(sourceSets.main) }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        neo_version: neo_version,
        minecraft_version: minecraft_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Build responsibilities stay separate from the target configuration above.
apply from: 'gradle/lms-launch.gradle'
apply from: 'gradle/lms-source-evidence.gradle'
apply from: 'gradle/lms-verification.gradle'
