plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        lms { sourceSet(sourceSets.main) }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        neo_version: neo_version,
        minecraft_version: minecraft_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Early FML transformation library: compiled independently from the ordinary NeoForge mod.
// FML discovers it as an FMLModType=LIBRARY service provider.
repositories { mavenCentral() }
sourceSets {
    launch {
        java.srcDir 'src/launch/java'
    }
}
configurations.launchCompileOnly.extendsFrom(configurations.compileOnly, configurations.compileClasspath)
dependencies {
    launchCompileOnly 'net.neoforged.fancymodloader:loader:12.0.9'
    launchCompileOnly 'org.ow2.asm:asm-tree:9.10.1'
    launchCompileOnly 'org.ow2.asm:asm-analysis:9.10.1'
}
tasks.register('launchJar', Jar) {
    group = 'lms'
    description = 'Build the separate early FML transformation library'
    archiveClassifier = 'launch'
    from sourceSets.launch.output
    manifest { attributes('FMLModType': 'LIBRARY') }
    dependsOn tasks.named('launchClasses')
}

def installLaunchJar = tasks.register('installLaunchJar') {
    group = 'lms'
    description = 'Install the current early FML transformation library into the development mods directory'
    dependsOn tasks.named('launchJar')
    inputs.file(tasks.named('launchJar').flatMap { it.archiveFile })
    outputs.upToDateWhen { false }
    doLast {
        def modsDir = layout.projectDirectory.dir('run/mods').asFile
        modsDir.mkdirs()
        fileTree(modsDir) {
            include 'lms-*-launch.jar'
        }.files.each { delete it }

        def sourceJar = tasks.named('launchJar').get().archiveFile.get().asFile
        copy {
            from sourceJar
            into modsDir
        }
        logger.lifecycle("LMS launch JAR installed from {} ({} bytes, modified={})",
                sourceJar.absolutePath, sourceJar.length(), sourceJar.lastModified())
    }
}

def launchJarPathProvider = tasks.named('launchJar').flatMap { it.archiveFile }.map { it.asFile.absolutePath }

def prepareLaunchPlan = tasks.register('prepareLaunchPlan', JavaExec) {
    group = 'lms'
    description = 'Compile the current legacy compatibility plan before FancyModLoader starts'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.fuckingdeveloper.lms.PreLaunchPlanCompiler'
    workingDir = layout.projectDirectory.dir('run')
    doFirst {
        delete layout.projectDirectory.file('run/lms/launch-plan.tsv')
    }
}

// Diagnostic runs must compile the current main LMS sources. Configure this
// provider at top level: Gradle 9 forbids configuring another task provider
// from inside runClient's configuration action.
tasks.named('compileJava') {
    outputs.upToDateWhen { false }
}
tasks.named('runClient') {
    dependsOn installLaunchJar, prepareLaunchPlan, tasks.named('classes')
    doFirst {
        logger.lifecycle("LMS launch JAR built at: {}", launchJarPathProvider.get())
        logger.lifecycle("LMS installed launch JARs: {}", fileTree(layout.projectDirectory.dir('run/mods')) {
            include 'lms-*-launch.jar'
        }.files*.absolutePath)
    }
}
tasks.named('runServer') {
    dependsOn installLaunchJar, prepareLaunchPlan
    doFirst {
        logger.lifecycle("LMS launch JAR built at: {}", launchJarPathProvider.get())
        logger.lifecycle("LMS installed launch JARs: {}", fileTree(layout.projectDirectory.dir('run/mods')) {
            include 'lms-*-launch.jar'
        }.files*.absolutePath)
    }
}

// Generate inspectable launch scripts for the actual ModDevGradle client/server pipeline.
tasks.named('createClientLaunchScript') {
    dependsOn tasks.named('launchJar')
}

/**
 * Isolated ForgeGradle 5 workspace. Forge 1.19.2 requires Java 17 and an
 * older Gradle wrapper; never apply ForgeGradle to this NeoForge project.
 * Run with -PlegacyJava17Home=/path/to/jdk17 if JAVA_HOME is not Java 17.
 */
tasks.register('prepareLegacyRuntime') {
    group = 'lms'
    description = 'Prepare a Forge 1.19.2 patched development runtime for bytecode inspection'
    doLast {
        def version = '1.19.2-43.4.0'
        def workspace = layout.buildDirectory.dir('legacy-forge1192').get().asFile
        def mdkZip = new File(workspace, 'forge-mdk.zip')
        def mdkDir = new File(workspace, 'mdk')
        def target = file('run/legacy-runtime/1.19.2/client.jar')
        workspace.mkdirs()
        if (!mdkZip.isFile()) {
            def url = new URL("https://maven.minecraftforge.net/net/minecraftforge/forge/${version}/forge-${version}-mdk.zip")
            logger.lifecycle("LMS: downloading Forge MDK ${version}")
            url.openConnection().with { connection ->
                connection.connectTimeout = 30000
                connection.readTimeout = 120000
                connection.inputStream.withCloseable { input ->
                    mdkZip.withOutputStream { output -> output << input }
                }
            }
        }
        if (!new File(mdkDir, 'gradlew').isFile()) {
            copy {
                from zipTree(mdkZip)
                into mdkDir
            }
        }
        def javaHome = providers.gradleProperty('legacyJava17Home').orNull
        if (javaHome == null) {
            throw new GradleException('Forge 1.19.2 needs JDK 17. Run with -PlegacyJava17Home=/absolute/path/to/jdk17')
        }
        def javaExe = new File(javaHome, 'bin/java')
        if (!javaExe.isFile()) throw new GradleException("JDK 17 not found: ${javaExe}")
        def wrapperJar = new File(mdkDir, 'gradle/wrapper/gradle-wrapper.jar')
        if (!wrapperJar.isFile()) throw new GradleException('Forge MDK Gradle wrapper missing')
        def command = [javaExe.absolutePath, '-cp', wrapperJar.absolutePath,
                       'org.gradle.wrapper.GradleWrapperMain', 'compileJava', '--no-daemon']
        logger.lifecycle('LMS: building isolated Forge 1.19.2 workspace (first run may take a while)')
        def process = new ProcessBuilder(command).directory(mdkDir)
                .inheritIO().start()
        if (process.waitFor() != 0) throw new GradleException('Forge 1.19.2 development workspace failed')
        def candidates = fileTree(new File(mdkDir, '.gradle')) {
            include '**/*mapped_official_1.19.2*.jar'
            exclude '**/*-sources.jar'
        }.files.findAll { it.isFile() && it.length() > 10_000_000L }
        candidates += fileTree(new File(System.getProperty('user.home'), '.gradle/caches/forge_gradle')) {
            include '**/*mapped_official_1.19.2*.jar'
            exclude '**/*-sources.jar'
        }.files.findAll { it.isFile() && it.length() > 10_000_000L }
        def preferred = candidates.findAll { it.name.contains('recomp') }
        def selected = (preferred ?: candidates).sort { -it.lastModified() }.find { jar ->
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                zip.getEntry('net/minecraft/world/entity/player/Player.class') != null
            }
        }
        if (selected == null) throw new GradleException(
            'ForgeGradle finished but no named patched Minecraft JAR was found. ' +
            'Inspect the isolated workspace build logs; do not substitute the vanilla client JAR.')
        target.parentFile.mkdirs()
        java.nio.file.Files.copy(selected.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("LMS: prepared ${target} from ${selected}")
    }
}
